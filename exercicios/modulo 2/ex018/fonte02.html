<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Minecraft';
            src: url('fontes/minecraft.ttf') format('truetype');
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: Minecraft;
            font-size: 2.7em;
        }

        p {
            font-family: Minecraft;
            font-size: 1.8em;
        }
    </style>
</head>
<body>
    <h1>Uma verdade do dia...</h1>
    <p>A noite tem a lua, e o dia tem o sol.</p>
</body>
</html>
