<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            height: 300px;
            width: 300px;
            background-color: #9fe1ff;
            border-width: 15px;
            border-style: solid;
            border-color: #491d9b;
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            margin-top: 5px;
            margin-right: 5px;
            margin-bottom: 35px;
            margin-left: 5px;
            outline-width: 5px;
            outline-style: dashed;
            outline-color: #9b4f1d;
        }

        a {
            background-color: #9fe1ff;
            height: 20px;
            width: 20px;
            border-color: #491d9b;
            border-width: 15px;
            border-style: solid;
            outline-width: 5px;
            outline-style: dashed;
            outline-color: #9b4f1d;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
